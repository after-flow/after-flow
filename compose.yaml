name: after-flow

x-development: &development
  build:
    context: .
    target: development
  init: true

services:
  web:
    <<: *development
    image: after-flow-web:local
    command: pnpm --filter @aftercare/web dev --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY: http://backend-server:8080
      VITE_WATCH_POLLING: "true"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/public:/workspace/apps/web/public:ro
      - ./apps/web/index.html:/workspace/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - ./packages/public-contracts/src:/workspace/packages/public-contracts/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [frontend]

  backend-server:
    <<: *development
    image: after-flow-backend-server:local
    command: pnpm --filter @aftercare/backend-server dev
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # 業務Firestoreの接続設定はBackendにだけ渡す。ai-serverには渡さない。
      # 既定では未設定。`make up-data` がEmulatorの宛先を入れる。
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST-}
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-after-flow-local}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./apps/backend-server/src:/workspace/apps/backend-server/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [frontend, services, data]

  ai-server:
    <<: *development
    image: after-flow-ai-server:local
    command: pnpm --filter @aftercare/ai-server dev
    environment:
      HOST: 0.0.0.0
      PORT: 8081
    volumes:
      - ./apps/ai-server/src:/workspace/apps/ai-server/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/internal/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [services]

  # 業務Firestoreの代わりに使う開発用Emulator。
  # 既定では起動しない（イメージが大きいため）。`make up-data` で有効になる。
  # ai-serverは data ネットワークに接続しない。AIへ業務DBを触らせないため。
  firestore-emulator:
    image: ${FIRESTORE_EMULATOR_IMAGE:-gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators}
    profiles: [data]
    init: true
    command: gcloud emulators firestore start --host-port=0.0.0.0:8085
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8085/"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [data]

networks:
  frontend:
  services:
    internal: true
  data:
    internal: true

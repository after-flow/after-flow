name: after-flow

x-development: &development
  build:
    context: .
    target: development
  init: true

services:
  web:
    <<: *development
    image: after-flow-web:local
    command: pnpm --filter @aftercare/web dev --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY: http://backend-server:8080
      VITE_WATCH_POLLING: "true"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/public:/workspace/apps/web/public:ro
      - ./apps/web/index.html:/workspace/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - ./packages/public-contracts/src:/workspace/packages/public-contracts/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [frontend]

  backend-server:
    <<: *development
    image: after-flow-backend-server:local
    command: pnpm --filter @aftercare/backend-server dev
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # 業務Firestoreの接続設定はBackendにだけ渡す。ai-serverには渡さない。
      # 既定では未設定。`make up` がEmulatorの宛先を入れる。
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST-}
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-after-flow-local}
      # 原本StorageもBackend専用。SDKの実験的なSTORAGE_EMULATOR_HOSTには
      # 依存せず、明示したendpointをapiEndpointとして渡す。
      DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT-}
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET-}
      DOCUMENT_STORAGE_EMULATOR_ENDPOINT: ${DOCUMENT_STORAGE_EMULATOR_ENDPOINT-}
      STORAGE_PROJECT_ID: ${STORAGE_PROJECT_ID:-after-flow-local}
      # 開発用のサービス間資格情報。公開APIの利用者認証とは別物。
      AI_SERVER_URL: http://ai-server:8081
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-after-flow-local-ai-service-token}
      AI_SERVICE_AUDIENCE: ${AI_SERVICE_AUDIENCE:-ai-server}
      BACKEND_SERVICE_AUDIENCE: ${BACKEND_SERVICE_AUDIENCE:-backend-internal}
      BACKEND_INTERNAL_SERVICE_TOKEN: ${BACKEND_INTERNAL_SERVICE_TOKEN:-after-flow-local-backend-service-token}
      BACKEND_EXECUTION_SIGNING_KEY: ${BACKEND_EXECUTION_SIGNING_KEY:-after-flow-local-execution-signing-key-2026}
      AI_CONNECTED_OPERATIONS: ${AI_CONNECTED_OPERATIONS-}
      READINESS_ACCESS_TOKEN: ${READINESS_ACCESS_TOKEN-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./apps/backend-server/src:/workspace/apps/backend-server/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [frontend, services, data]

  ai-server:
    <<: *development
    image: after-flow-ai-server:local
    restart: unless-stopped
    command: pnpm --filter @aftercare/ai-server dev
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      AI_RUNTIME_MODE: ${AI_RUNTIME_MODE:-auto}
      ORCAROUTER_API_KEY: ${ORCAROUTER_API_KEY-}
      AI_ORCA_CORE_MODEL: ${AI_ORCA_CORE_MODEL:-openai/gpt-4o-mini}
      AI_ORCA_FALLBACK_MODEL: ${AI_ORCA_FALLBACK_MODEL:-google/gemini-2.5-flash}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-after-flow-local-ai-service-token}
      AI_SERVICE_AUDIENCE: ${AI_SERVICE_AUDIENCE:-ai-server}
      BACKEND_INTERNAL_URL: http://backend-server:8080
      BACKEND_SERVICE_AUDIENCE: ${BACKEND_SERVICE_AUDIENCE:-backend-internal}
      BACKEND_INTERNAL_SERVICE_TOKEN: ${BACKEND_INTERNAL_SERVICE_TOKEN:-after-flow-local-backend-service-token}
      # 開発用AI Runtime専用値。productionへ流用しない。
      AI_RUNTIME_PROJECT_ID: after-flow-ai-runtime
      AI_RUNTIME_DATABASE_ID: ai-runtime-local
      AI_RUNTIME_EMULATOR_HOST: ai-runtime-emulator:8085
      AI_RUNTIME_ENCRYPTION_KEY: ${AI_RUNTIME_ENCRYPTION_KEY:-YWZ0ZXItZmxvdy1oYWNrYXRob24tcnVudGltZS1rZXk=}
    volumes:
      - ./apps/ai-server/src:/workspace/apps/ai-server/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/internal/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [services, ai-runtime, ai-egress]
    depends_on:
      ai-runtime-emulator:
        condition: service_healthy

  # HTTP要求から独立してOutboxを配送するBackend専用worker（#122）。
  # backend-serverと同じimageだが別container・別process。hostへportを公開しない。
  # 業務Firestoreの data とAI Serverへの services にだけ参加し、frontend、AI Runtime、
  # emulator-host には参加しない。原本Storage・AI→Backend資格情報・readiness tokenは渡さない。
  # 業務Firestore Emulatorと同じ data profileで起動し、`make up` が有効にする。
  backend-worker:
    <<: *development
    image: after-flow-backend-server:local
    profiles: [data]
    restart: unless-stopped
    command: pnpm --filter @aftercare/backend-server worker
    environment:
      # 担当tenantを明示する。暗黙の全tenant走査はしない。
      OUTBOX_TENANT_IDS: ${OUTBOX_TENANT_IDS:-after-flow-demo}
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-5000}
      # AI HTTP timeout（AI_SERVICE_TIMEOUT_MS）より必ず長くする。
      OUTBOX_VISIBILITY_MS: ${OUTBOX_VISIBILITY_MS:-120000}
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST-}
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-after-flow-local}
      # Backend→AIの配送先と資格情報。backend-serverと同じ値にする。
      AI_SERVER_URL: http://ai-server:8081
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-after-flow-local-ai-service-token}
      AI_SERVICE_AUDIENCE: ${AI_SERVICE_AUDIENCE:-ai-server}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-10000}
      # Run capabilityの署名鍵と宛先。AIへは渡さない。
      BACKEND_SERVICE_AUDIENCE: ${BACKEND_SERVICE_AUDIENCE:-backend-internal}
      BACKEND_EXECUTION_SIGNING_KEY: ${BACKEND_EXECUTION_SIGNING_KEY:-after-flow-local-execution-signing-key-2026}
    volumes:
      - ./apps/backend-server/src:/workspace/apps/backend-server/src:ro
    networks: [services, data]
    depends_on:
      firestore-emulator:
        condition: service_healthy
      backend-server:
        condition: service_healthy
      ai-server:
        condition: service_healthy

  # AIの実行receipt/snapshotだけを保存する専用Emulator。
  # 業務Firestoreとはproject、接続設定、networkを共有しない。
  ai-runtime-emulator:
    image: ${FIRESTORE_EMULATOR_IMAGE:-gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators}
    init: true
    restart: unless-stopped
    environment:
      FIRESTORE_PROJECT_ID: after-flow-ai-runtime
    command: gcloud emulators firestore start --host-port=0.0.0.0:8085
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null 'http://127.0.0.1:8085/v1/projects/after-flow-ai-runtime/databases/ai-runtime-local/documents/__health'"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [ai-runtime]

  # 業務Firestoreの代わりに使う開発用Emulator。
  # Compose単体の既定profileでは起動しない。`make up` がdata profileを有効にする。
  # ai-serverは data ネットワークに接続しない。AIへ業務DBを触らせないため。
  firestore-emulator:
    image: ${FIRESTORE_EMULATOR_IMAGE:-gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators}
    profiles: [data]
    init: true
    environment:
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-after-flow-local}
    command: gcloud emulators firestore start --host-port=0.0.0.0:8085
    ports:
      - "127.0.0.1:${FIRESTORE_EMULATOR_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null 'http://127.0.0.1:8085/v1/projects/'\"$${FIRESTORE_PROJECT_ID}\"'/databases/(default)/documents/__health'"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [data, emulator-host]

  # Cloud Storage互換の開発用Emulator。起動時に空のbucketを作る。
  # 原本資格情報と同様に、接続先もBackendにだけ渡す。
  storage-emulator:
    image: ${STORAGE_EMULATOR_IMAGE:-fsouza/fake-gcs-server:1.54.0@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f}
    profiles: [data]
    init: true
    environment:
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-after-flow-documents}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p "/bootstrap/$${DOCUMENT_STORAGE_BUCKET}"
        exec /bin/fake-gcs-server \
          -data /bootstrap \
          -backend memory \
          -scheme http \
          -host 0.0.0.0 \
          -port 4443 \
          -external-url http://storage-emulator:4443
    ports:
      - "127.0.0.1:${STORAGE_EMULATOR_PORT:-4443}:4443"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null 'http://127.0.0.1:4443/storage/v1/b/'\"$${DOCUMENT_STORAGE_BUCKET}\""]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks: [data, emulator-host]

networks:
  frontend:
  services:
    internal: true
  ai-runtime:
    internal: true
  # AIからOrcaRouterと許可済み公式HTTPS資料への外向き通信専用。
  # 他のアプリサービスは参加せず、AIのportも公開しない。
  ai-egress:
  data:
    internal: true
  # internalネットワークだけではDocker Desktopがportsを公開しないため、
  # Emulatorだけをホスト公開用bridgeにも接続する。業務サービスは参加しない。
  emulator-host:

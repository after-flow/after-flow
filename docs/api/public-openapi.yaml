                        deceasedName:
                          type: string
                        deceasedNameKana:
                          nullable: true
                          type: string
                        dateOfDeath:
                          type: string
                        dateOfBirth:
                          nullable: true
                          type: string
                        knownAt:
                          nullable: true
                          type: string
                        ownerName:
                          type: string
                        relationshipToDeceased:
                          type: string
                        municipality:
                          nullable: true
                          type: string
                        status:

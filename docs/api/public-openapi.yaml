          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - IDEMPOTENCY_KEY_REUSED
                - PRECONDITION_REQUIRED
                - PRECONDITION_FAILED
                - CONSENT_REQUIRED
                - FEATURE_NOT_CONNECTED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - UNAVAILABLE
                - INTERNAL
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: {}
          required:
            - code
            - message
            - retryable
          additionalProperties: false
        meta:
          type: object
          properties:
            requestId:
              type: string
            nextCursor:
              type: string
          required:
            - requestId
          additionalProperties: false
      required:
        - error
        - meta
      additionalProperties: false

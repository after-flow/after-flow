          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "500":
          description: "error.code: INTERNAL"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
    get:
      operationId: listCases
      summary: 自分が参加している案件の一覧
      description: 続きは meta.nextCursor で取得する。件数から全件を推測しない。

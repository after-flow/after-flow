  /cases:
    post:
      operationId: createCase
      summary: 案件を作成する
      description: 作成者を OWNER として membership を同じ Transaction で確定する。初期手続きと期限の生成は別の処理が行う。
      tags:
        - cases
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同じ操作の再送を重複適用しないためのキー。同じキーで異なる内容を送ると IDEMPOTENCY_KEY_REUSED になる。
          schema:
            type: string
            minLength: 8
            maxLength: 200
        - name: X-Request-Id
          in: header
          required: false
          description: 指定すると応答の meta.requestId に引き継ぐ。安全な字種・長さでない場合はサーバーが採番する。
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deceasedName:
                  type: string
                  minLength: 1
                  maxLength: 100
                deceasedNameKana:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 100
                dateOfDeath:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                dateOfBirth:
                  nullable: true
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                knownAt:
                  nullable: true
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                ownerName:
                  type: string
                  minLength: 1
                  maxLength: 100
                relationshipToDeceased:
                  type: string
                  minLength: 1
                  maxLength: 50
                municipality:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 50
              required:
                - deceasedName
                - dateOfDeath
                - ownerName
                - relationshipToDeceased
              additionalProperties: false
      responses:
        "201":
          description: 作成した案件
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      deceasedName:
                        type: string
                      deceasedNameKana:
                        nullable: true
                        type: string
                      dateOfDeath:
                        type: string
                      dateOfBirth:
                        nullable: true
                        type: string
                      knownAt:
                        nullable: true
                        type: string
                      ownerName:
                        type: string
                      relationshipToDeceased:
                        type: string
                      municipality:
                        nullable: true
                        type: string
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - CLOSED
                      version:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      caseVersion:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      updatedAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      allowedActions:
                        type: array
                        items:
                          type: string
                          enum:
                            - UPDATE_BASIC_INFO
                            - ADMINISTER
                    required:
                      - id
                      - deceasedName
                      - deceasedNameKana
                      - dateOfDeath
                      - dateOfBirth
                      - knownAt
                      - ownerName
                      - relationshipToDeceased
                      - municipality
                      - status
                      - version
                      - caseVersion
                      - createdAt
                      - updatedAt
                      - allowedActions
                    additionalProperties: false
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                      nextCursor:
                        type: string
                    required:
                      - requestId
                    additionalProperties: false
                required:
                  - data
                  - meta
                additionalProperties: false
        "400":
          description: "error.code: VALIDATION_FAILED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "401":
          description: "error.code: UNAUTHENTICATED"
          content:

  /runs/{runId}/dispatch:
    post:
      operationId: ai_dispatch
      description: AI Server provider契約。Backendはこの契約で送信する。AI実装/ readiness完了の宣言ではない。
      servers: &a6
        - url: https://ai-server.internal/internal/v1
      security: &a7
        - serviceIdentity: []
      parameters: &a8
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: X-Audience
          in: header
          required: true
          schema:
            type: string
            const: ai-server
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody: &a9
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                jobId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
                runId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
                executionAttempt:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
                operation:
                  type: string
                  enum:
                    - case_planning
                    - task_guidance
                    - chat_reply
                    - document_analysis
                issuedAt:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                expiresAt:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                executionAuthorization:
                  type: string
                  minLength: 1
                  maxLength: 4096
              required:
                - jobId
                - runId
                - executionAttempt
                - operation
                - issuedAt
                - expiresAt
                - executionAuthorization
              additionalProperties: false
      responses: &a10
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  jobId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_-]+$
                  runId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_-]+$
                  status:
                    type: string
                    enum:
                      - ACCEPTED
                      - DUPLICATE
                required:
                  - jobId
                  - runId
                  - status
                additionalProperties: false
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  jobId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_-]+$
                  runId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_-]+$
                  status:
                    type: string
                    enum:
                      - ACCEPTED
                      - DUPLICATE
                required:
                  - jobId
                  - runId
                  - status
                additionalProperties: false
        "409":
          description: Verified duplicate only
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  jobId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_-]+$
                  runId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_-]+$
                  status:
                    type: string

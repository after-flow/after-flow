name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_USE_MOCK: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all workspaces
        run: pnpm typecheck
      - name: Lint and verify dependency boundaries
        run: pnpm lint
      - name: Verify the generated OpenAPI matches the implemented routes
        run: pnpm openapi:check
      - name: Run workspace tests
        run: pnpm test
      - name: Build all workspaces
        run: pnpm build
      - name: Verify production excludes the mock service worker
        run: |
          test -f apps/web/dist/index.html
          test ! -f apps/web/dist/mockServiceWorker.js

  firestore:
    name: Firestore integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # Emulatorに対してのみ実行する。実Firestoreの資格情報は使わない。
      - name: Run Firestore integration tests against the emulator
        run: pnpm test:firestore

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: after-flow-ci
      WEB_PORT: '5173'
      BACKEND_PORT: '8080'
      VITE_USE_MOCK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start all services
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify HTTP connectivity and AI isolation
        run: node scripts/smoke-compose.mjs
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

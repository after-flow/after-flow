name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      service:
        description: Independently deployed service
        type: choice
        options: [web, backend-server, ai-server]
        required: true
      ci_run_id:
        description: Successful main push CI run ID (images retained for 30 days)
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node scripts/verify-ci-run.mjs

  deploy:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.preflight.outputs.url }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SERVICE: ${{ inputs.service }}
      SHA: ${{ needs.source.outputs.sha }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE_PREFIX }}-${{ inputs.service }}
      WEB_RUNTIME_SA: ${{ vars.WEB_RUNTIME_SERVICE_ACCOUNT }}
      BACKEND_RUNTIME_SA: ${{ vars.BACKEND_RUNTIME_SERVICE_ACCOUNT }}
      AI_RUNTIME_SA: ${{ vars.AI_RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check required environment configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          SERVICE_PREFIX: ${{ vars.CLOUD_RUN_SERVICE_PREFIX }}
        run: |
          for name in PROJECT REGION REPOSITORY WIF_PROVIDER DEPLOY_SA SERVICE_PREFIX WEB_RUNTIME_SA BACKEND_RUNTIME_SA AI_RUNTIME_SA; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing environment variable $name"
              exit 1
            fi
          done
          test "$WEB_RUNTIME_SA" != "$BACKEND_RUNTIME_SA"
          test "$WEB_RUNTIME_SA" != "$AI_RUNTIME_SA"
          test "$BACKEND_RUNTIME_SA" != "$AI_RUNTIME_SA"
          for account in "$WEB_RUNTIME_SA" "$BACKEND_RUNTIME_SA" "$AI_RUNTIME_SA"; do
            test "$account" != "$DEPLOY_SA"
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-images
          path: images
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@26f734c2779b00b7dda794207734c511110a4368 # v3.0.0
        with:
          version: '541.0.0'
      - name: Verify existing service, identity and rollback target
        id: preflight
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT" --region "$REGION" --format=json > service.json
          case "$SERVICE" in
            web) expected="$WEB_RUNTIME_SA" ;;
            backend-server) expected="$BACKEND_RUNTIME_SA" ;;
            ai-server) expected="$AI_RUNTIME_SA" ;;
          esac
          jq -e --arg sa "$expected" '.spec.template.spec.serviceAccountName == $sa' service.json
          node scripts/cloud-run-state.mjs service.json >> "$GITHUB_OUTPUT"
          if [[ "$SERVICE" == ai-server ]]; then
            gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$PROJECT" --region "$REGION" --format=json > policy.json
            jq -e 'all(.bindings[]?.members[]?; . != "allUsers" and . != "allAuthenticatedUsers")' policy.json
            jq -e '.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] != "true"' service.json
          fi
      - name: Copy verified image to Artifact Registry
        id: image
        run: |
          registry="$REGION-docker.pkg.dev"
          gcloud auth configure-docker "$registry" --quiet
          docker load --input "images/$SERVICE.tar.gz"
          image="$registry/$PROJECT/$REPOSITORY/$SERVICE:sha-$SHA"
          docker tag "after-flow-$SERVICE:$SHA" "$image"
          docker push "$image"
          digest="$(gcloud artifacts docker images describe "$image" --project "$PROJECT" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=$registry/$PROJECT/$REPOSITORY/$SERVICE@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy candidate without traffic
        id: candidate
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          tag="candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --port 8080 --no-traffic --tag "$tag" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT" --region "$REGION" --format=json > candidate.json
          url="$(jq -er --arg tag "$tag" '.status.traffic[] | select(.tag == $tag) | .url' candidate.json)"
          revision="$(jq -er --arg tag "$tag" '.status.traffic[] | select(.tag == $tag) | .revisionName' candidate.json)"
          {
            echo "url=$url"
            echo "revision=$revision"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Get service-scoped identity token for smoke test
        id: identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.preflight.outputs.url }}
          id_token_include_email: true
      - name: Verify candidate before promotion
        env:
          SMOKE_URL: ${{ steps.candidate.outputs.url }}
          ID_TOKEN: ${{ steps.identity.outputs.id_token }}
        run: node scripts/smoke-cloud-run.mjs
      - name: Promote tested revision and restore traffic if smoke fails
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
          PREVIOUS_TRAFFIC: ${{ steps.preflight.outputs.traffic }}
          SMOKE_URL: ${{ steps.preflight.outputs.url }}
          ID_TOKEN: ${{ steps.identity.outputs.id_token }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          rollback() {
            gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
              --project "$PROJECT" --region "$REGION" --to-revisions "$PREVIOUS_TRAFFIC" --quiet
          }
          trap rollback ERR
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$REGION" --to-revisions "$REVISION=100" --quiet
          node scripts/smoke-cloud-run.mjs
          trap - ERR
          {
            echo "### $SERVICE deployment"
            echo "- Commit: \`$SHA\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Revision: \`$REVISION\`"
            echo "- Previous traffic: \`$PREVIOUS_TRAFFIC\`"
            echo "- Service: $SMOKE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary candidate tag
        if: always() && steps.candidate.outcome == 'success'
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$REGION" --remove-tags "$TAG" --quiet

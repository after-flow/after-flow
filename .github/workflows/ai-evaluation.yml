name: AI holdout evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-holdout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run fixed synthetic holdout (no live providers)
        run: pnpm eval:ai holdout
      - name: Save all trials including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-holdout-report
          path: reports/ai-eval-holdout.json
          retention-days: 14
          if-no-files-found: error

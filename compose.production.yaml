name: after-flow-production

x-runtime: &runtime
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  web:
    <<: *runtime
    build:
      context: .
      target: web-production
    image: after-flow-web:${IMAGE_TAG:-production-local}
    environment:
      BACKEND_ORIGIN: http://backend-server:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks: [frontend]

  backend-server:
    <<: *runtime
    build:
      context: .
      target: backend-production
    image: after-flow-backend-server:${IMAGE_TAG:-production-local}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks: [frontend, services]

  ai-server:
    <<: *runtime
    build:
      context: .
      target: ai-production
    image: after-flow-ai-server:${IMAGE_TAG:-production-local}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/internal/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks: [services]

networks:
  frontend:
  services:
    internal: true
